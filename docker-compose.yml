services:
  postgres:
    image: postgres:16-alpine
    container_name: voxter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxter
      POSTGRES_PASSWORD: voxter
      POSTGRES_DB: voxter
    ports:
      - "5432:5432"
    volumes:
      - voxter_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxter -d voxter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  voxter_postgres_data:
